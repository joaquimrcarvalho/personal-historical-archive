# personal-historical-archive (pha) configuration
#
# archive_dir is the single SELF-CONTAINED data root. Everything the archive
# owns lives under it: the input documents, the model/prompt definitions
# (palaeographers / editors / encoders) and everything the pipeline generates
# (library, renders, db). The project dir holds only code, engine-level
# prompts (prompts/) and the _sample.md templates.
#
# archive_dir precedence: PHA_ARCHIVE_DIR env var > PHA_ARCHIVE_DIR in the
# gitignored .env (set via `pha set archive-dir`) > paths.archive_dir >
# default "." (the project root — fully backward compatible).
#
# paths below that hold DATA are relative to archive_dir. paths that hold
# CODE/CONFIG (prompts) are relative to the project root.

paths:
  archive_dir: .          # data root (default: this project dir)
  dropbox: dropbox        # input documents (+ optional <stem>.prompt.md sidecars)
                          #   subdirectories become 'collections':
                          #     dropbox/documents/            individual documents
                          #     dropbox/collections/COLX/     a collection of sources
                          #     dropbox/collections/COLX/prompt.md  -> prompt for the collection
  library: library        # generated: human-readable extracted markdown per document
  renders: renders        # generated: cached page images fed to the vision model
  palaeographers: palaeographers   # model definitions (one file per palaeographer)
  editors: editors        # model definitions (one file per editor)
  encoders: encoders      # the DEFAULT encoder + its template (per-collection
                          #   encoders live next to their sources in dropbox/)
  db: archive.db          # generated: SQLite database

  # engine-level (PROJECT-relative, not archive-relative):
  prompts: prompts        # default + per-file prompt files

# Palaeographers live as one file per model in the 'palaeographers/' directory.
# To add one: duplicate palaeographers/_sample.md, rename, edit, save.
# The file name (without extension) is the palaeographer id; the YAML front
# matter holds the endpoint/model settings, the body is the base prompt that
# is prepended BEFORE the document/collection sidecar prompt.
# Select per document/collection with a 'palaeographer' file next to it.

vision:
  palaeographer: qwen-local         # which palaeographer transcribes documents

# Editors live as one file per model in the 'editors/' directory (same
# convention: duplicate editors/_sample.md, rename, edit, save). Each editor
# is a DIFFERENT (text) model than the palaeographer; its body prompt
# transforms the transcription (modernize, translate, ...). Select per
# document/collection with an 'editor' file next to it.

# Encoders live as one file per model in the 'encoders/' directory (same
# convention: duplicate encoders/_sample.md, rename, edit, save). Each
# encoder is a (text) model that turns transcriptions into structured
# records (e.g. letter metadata); it runs over the EDITED text when
# available. The encoder prompt for a document/collection is a
# stage-qualified 'encoder.prompt.md' file next to it (plain 'prompt.md'
# stays the palaeographer prompt). Select per document/collection with an
# 'encoder' file next to it.

# Embedding model for semantic search (independent of palaeographers).
# LM Studio serves text-embedding-nomic-embed-text-v1.5 if downloaded;
# alternatively point at Ollama: backend: ollama, base_url: http://127.0.0.1:11434/v1, model: nomic-embed-text
embeddings:
  backend: lmstudio
  base_url: http://127.0.0.1:1234/v1
  model: text-embedding-nomic-embed-text-v1.5@q4_k_m
  timeout_s: 120

extraction:
  render_dpi: 72          # render resolution for PDF pages (72 works for qwen; ~4x faster than 200)
  max_image_px: 1800      # cap the long edge of page images (VLM input size)
  jpeg_quality: 88
  chunk_chars: 2000       # index chunk size
  chunk_overlap: 200
  concurrency: 1          # parallel VLM calls; 1 is safest on 24 GB
  dir_documents: true     # a directory of images (no subdirs/PDFs) is ONE document;
                          # its prompt applies to scanning each image

search:
  default_mode: hybrid    # hybrid | keyword | semantic
  top_k: 10

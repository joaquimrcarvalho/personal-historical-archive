# personal-historical-archive (pha) configuration
# All relative paths resolve against the project root (where this file lives).

paths:
  dropbox: dropbox        # drop PDFs/images here (+ optional <stem>.prompt.md sidecars)
                          # subdirectories are supported and become 'collections':
                          #   dropbox/documents/            individual documents
                          #   dropbox/collections/COLX/     a collection of sources
                          #   dropbox/collections/COLX/prompt.md  -> prompt for the whole collection
  library: library        # human-readable extracted markdown per document
  data: data              # sqlite db + page renders
  renders: data/renders   # cached page images fed to the vision model
  prompts: prompts        # default + per-file prompt files
  db: data/archive.db

# Palaeographers: named vision models that transcribe the documents.
# Each has its own endpoint (local or remote), model, optional API key, and a
# base prompt that is prepended BEFORE the document/collection sidecar prompt.
palaeographers:
  qwen-local:
    description: qwen3-vl-8b via LM Studio (local, default)
    base_url: http://127.0.0.1:1234/v1
    model: qwen/qwen3-vl-8b
    api_key: ""                     # local servers need none
    temperature: 0.1
    max_tokens: 4096
    timeout_s: 900
    prompt_file: prompts/palaeographers/qwen-local.md
  # Example remote palaeographer (OpenAI-compatible API, key from env):
  # gpt-remote:
  #   description: remote model for comparison
  #   base_url: https://api.openai.com/v1
  #   model: gpt-4o
  #   api_key: "${OPENAI_API_KEY}"
  #   temperature: 0.1
  #   max_tokens: 4096
  #   timeout_s: 300
  #   prompt_file: prompts/palaeographers/gpt-remote.md
  # Specialised for 17th-century Portuguese secretary hand. Activate per
  # document/collection by placing a 'palaeographer' file containing this id
  # next to the document or in the collection directory.
  portuguese-secretary:
    description: 17th-c. Portuguese secretary-hand specialist (LM Studio)
    base_url: http://127.0.0.1:1234/v1
    model: qwen/qwen3-vl-8b
    api_key: ""
    temperature: 0.0
    max_tokens: 4096
    timeout_s: 900
    prompt_file: prompts/palaeographers/portuguese-secretary.md

vision:
  palaeographer: qwen-local         # which palaeographer transcribes documents

# Editors: text models that transform the palaeographer's transcription.
# Each editor is a DIFFERENT model than the palaeographer (own endpoint/model/
# api key) applying an editing prompt (modernize, translate, ...). Select per
# document/collection with an 'editor' file (same mechanism as palaeographers).
editors:
  modern-portuguese:
    description: Convert to modern Portuguese orthography, expand abbreviations
    base_url: http://127.0.0.1:1234/v1
    model: amalia-9b-0626-dpo
    api_key: ""
    temperature: 0.0
    max_tokens: 4096
    timeout_s: 300
    prompt_file: prompts/editors/modern-portuguese.md
  # translate-english:
  #   description: Translate the transcription to English
  #   base_url: http://127.0.0.1:1234/v1
  #   model: amalia-9b-0626-dpo
  #   api_key: ""
  #   temperature: 0.0
  #   max_tokens: 4096
  #   timeout_s: 300
  #   prompt: "Translate this transcription to English. Keep the structure. Output only the translation."

# Embedding model for semantic search (independent of palaeographers).
# LM Studio serves text-embedding-nomic-embed-text-v1.5 if downloaded;
# alternatively point at Ollama: backend: ollama, base_url: http://127.0.0.1:11434/v1, model: nomic-embed-text
embeddings:
  backend: lmstudio
  base_url: http://127.0.0.1:1234/v1
  model: text-embedding-nomic-embed-text-v1.5@q4_k_m
  timeout_s: 120

extraction:
  render_dpi: 200         # render resolution for PDF pages
  max_image_px: 1800      # cap the long edge of page images (VLM input size)
  jpeg_quality: 88
  chunk_chars: 2000       # index chunk size
  chunk_overlap: 200
  concurrency: 1          # parallel VLM calls; 1 is safest on 24 GB
  dir_documents: true     # a directory of images (no subdirs/PDFs) is ONE document;
                          # its prompt applies to scanning each image

search:
  default_mode: hybrid    # hybrid | keyword | semantic
  top_k: 10

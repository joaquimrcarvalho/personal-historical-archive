# dsh-pha — example cordis patch layer for a harness profile.
#
# Append to the profile's cordis.patch.yml (e.g. $DSH_HOME/profiles/desktop/cordis.patch.yml)
# AFTER the package is resolvable in that profile's node_modules (see README.md).
#
# `dsh-pha` registers the pha_* model tools on the host `tools` registry, so they appear in
# every session. It needs no isolate realm: it publishes no Cordis service.
- insert:
    - id: dsh-pha
      name: '@personal-historical-archive/dsh-pha'
      config:
        # The pha checkout (directory holding config.yaml), NOT the archive data
        # root. pha resolves the archive from this project. Without it the
        # plugin runs pha from cwd `/`, where a built/installed pha cannot find
        # its config and the PHA view reports no archive. PHA_HOME in the
        # harness environment is the fallback.
        projectRoot: /path/to/personal-historical-archive

[project]
name = "personal-historical-archive"
version = "0.6.0"
description = "Personal Historical Archive (pha): local archive of historical documents (manuscripts, old books, maps, ...) — drop folder + VLM text extraction (Ollama/LM Studio) + index + MCP search"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "watchdog>=4.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "jsonschema>=4.0",
    "PyYAML>=6.0",
    "fastmcp>=2.0",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
pha = "personal_historical_archive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_historical_archive"]
